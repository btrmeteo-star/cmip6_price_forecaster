<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌽 CMIP6 農產品價格預測系統</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f9f9f9;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: inline-block;
      width: 200px;
      font-weight: bold;
      vertical-align: top;
    }
    input[type="number"] {
      width: 150px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    select, button {
      padding: 10px 16px;
      margin-top: 10px;
      border: none;
      border-radius: 4px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #result {
      margin-top: 20px;
      padding: 12px;
      border-radius: 4px;
      font-weight: bold;
    }
    .success { background-color: #d4edda; color: #155724; }
    .error { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>

<h1>🌽 CMIP6 農產品價格預測系統</h1>

<div class="form-group">
  <label for="crop">作物類型:</label>
  <select id="crop" onchange="updateForm()">
    <option value="corn">玉米 (Corn)</option>
    <option value="wheat">小麥 (Wheat)</option>
    <option value="soybean">大豆 (Soybean)</option>
  </select>
</div>

<!-- 动态表单区域 -->
<div id="form-fields"></div>

<button onclick="predictPrice()">預測價格</button>

<div id="result"></div>

<script>
  // 定义每种作物的特征映射（必须与模型训练时一致）
  const cropFeatures = {
    corn: [
      { key: "pr", label: "當前降雨量 (pr):" },
      { key: "pr_lag1", label: "前一期降雨量 (pr_lag1):" },
      { key: "pr_lag2", label: "前兩期降雨量 (pr_lag2):" },
      { key: "pr_std", label: "降雨標準差 (pr_std):" },
      { key: "price_lag1", label: "前一期價格 (price_lag1):" },
      { key: "price_lag2", label: "前兩期價格 (price_lag2):" },
      { key: "tasmax", label: "當前最高溫 (tasmax):" },
      { key: "tasmax_lag1", label: "前一期最高溫 (tasmax_lag1):" },
      { key: "tasmax_lag2", label: "前兩期最高溫 (tasmax_lag2):" },
      { key: "tasmax_mean", label: "最高溫平均值 (tasmax_mean):" }
    ],
    wheat: [
      { key: "pr", label: "當前降雨量 (pr):" },
      { key: "pr_lag1", label: "前一期降雨量 (pr_lag1):" },
      { key: "pr_lag2", label: "前兩期降雨量 (pr_lag2):" },
      { key: "pr_std", label: "降雨標準差 (pr_std):" },
      { key: "price_lag1", label: "前一期價格 (price_lag1):" },
      { key: "price_lag2", label: "前兩期價格 (price_lag2):" },
      { key: "tasmax", label: "當前最高溫 (tasmax):" },
      { key: "tasmax_lag1", label: "前一期最高溫 (tasmax_lag1):" },
      { key: "tasmax_lag2", label: "前兩期最高溫 (tasmax_lag2):" },
      { key: "tasmax_mean", label: "最高溫平均值 (tasmax_mean):" }
    ],
    soybean: [
      { key: "pr", label: "當前降雨量 (pr):" },
      { key: "pr_lag1", label: "前一期降雨量 (pr_lag1):" },
      { key: "pr_lag2", label: "前兩期降雨量 (pr_lag2):" },
      { key: "pr_std", label: "降雨標準差 (pr_std):" },
      { key: "price_lag1", label: "前一期價格 (price_lag1):" },
      { key: "price_lag2", label: "前兩期價格 (price_lag2):" },
      { key: "tasmax", label: "當前最高溫 (tasmax):" },
      { key: "tasmax_lag1", label: "前一期最高溫 (tasmax_lag1):" },
      { key: "tasmax_lag2", label: "前兩期最高溫 (tasmax_lag2):" },
      { key: "tasmax_mean", label: "最高溫平均值 (tasmax_mean):" }
    ]
  };

  // 根据选择的作物动态更新表单
  function updateForm() {
    const crop = document.getElementById('crop').value;
    const fieldsDiv = document.getElementById('form-fields');
    fieldsDiv.innerHTML = '';

    const features = cropFeatures[crop] || [];
    features.forEach(item => {
      const div = document.createElement('div');
      div.className = 'form-group';
      div.innerHTML = `
        <label for="${item.key}">${item.label}</label>
        <input type="number" id="${item.key}" step="0.1" value="1.0">
      `;
      fieldsDiv.appendChild(div);
    });
  }

  async function predictPrice() {
    const crop = document.getElementById('crop').value;
    const data = {};
    const features = cropFeatures[crop];

    // 收集所有输入值
    features.forEach(f => {
      const val = parseFloat(document.getElementById(f.key).value);
      if (isNaN(val)) {
        showResult(`錯誤：${f.key} 必須是數字`, false);
        return;
      }
      data[f.key] = val;
    });

    try {
      const response = await fetch(`/predict?crop=${encodeURIComponent(crop)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data })
      });

      const result = await response.json();

      if (response.ok) {
        showResult(`預測成功！預估價格為：${result.predicted_price.toFixed(2)}`, true);
      } else {
        showResult(`預測失敗：${result.detail || '未知錯誤'}`, false);
      }
    } catch (error) {
      showResult(`請求失敗：${error.message}`, false);
    }
  }

  function showResult(message, isSuccess) {
    const resultDiv = document.getElementById('result');
    resultDiv.textContent = message;
    resultDiv.className = isSuccess ? 'success' : 'error';
  }

  // 页面加载完成后初始化
  window.onload = () => {
    updateForm();
  };
</script>

</body>
</html>
